[project]
name = "east-py"
version = "0.1.0"
description = "Python runtime for the East programming language"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Proprietary"}
authors = [
    {name = "East Contributors", email = "east@example.com"}
]
keywords = ["east", "embedded", "language", "runtime", "interpreter"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Interpreters",
    "Private :: Do Not Upload",
]

dependencies = [
    "sortedcontainers>=2.4.0",
    "typing-extensions>=4.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "mypy>=1.11.0",
    "ruff>=0.6.0",
    "pre-commit>=3.8.0",
    "pydocstyle>=6.3.0",
    "bandit[toml]>=1.7.9",
]
numeric = [
    "numpy>=1.26.0",
]
data = [
    "pandas>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/elara-ai/east-py"
Documentation = "https://github.com/elara-ai/east-py"
Repository = "https://github.com/elara-ai/east-py"
Issues = "https://github.com/elara-ai/east-py/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["east"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "mypy>=1.11.0",
    "ruff>=0.6.0",
    "pre-commit>=3.8.0",
    "pydocstyle>=6.3.0",
    "bandit[toml]>=1.7.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "--verbose --cov=east --cov-report=term-missing"

[tool.mypy]
python_version = "3.11"
warn_return_any = false  # East is dynamically typed
warn_unused_configs = true
disallow_untyped_defs = false  # Gradual typing
check_untyped_defs = true
# Disable checks that don't apply well to dynamically-typed East values
disable_error_code = ["no-any-return", "has-type", "override"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort (import sorting)
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "RET",  # flake8-return
    "ARG",  # flake8-unused-arguments
]
ignore = [
    "E501",   # Line too long (handled by formatter)
    "N802",   # Function names can be PascalCase for type constructors
    "N812",   # Lowercase imported as non-lowercase (East types)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ARG"]  # Allow unused arguments in tests

[tool.coverage.run]
source = ["east"]
omit = ["*/tests/*", "*/tmp/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.pydocstyle]
convention = "google"
add-ignore = ["D100", "D104"]  # Missing docstring in public module/package

[tool.bandit]
exclude_dirs = ["tests", "tmp"]
skips = ["B101"]  # Allow assert statements
