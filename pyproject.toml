[project]
name = "east-py-monorepo"
version = "0.1.0"
description = "East programming language Python implementations"
requires-python = ">=3.11"
license = { file = "LICENSE.md" }

[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-subtests>=0.11.0",
    "mypy>=1.11.0",
    "ruff>=0.6.0",
    "pre-commit>=3.8.0",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
mypy_path = "packages/east-py:packages/east-py-std:packages/east-py-io:packages/east-py-datascience/src"
disable_error_code = [
    "no-any-return",
    "has-type",
    "override",
    "attr-defined",
    "arg-type",
    "typeddict-item",
    "assignment",
    "no-redef",
    "call-overload",
    "index",
    "union-attr",
]

[[tool.mypy.overrides]]
module = ["sortedcontainers", "sortedcontainers.*"]
ignore_missing_imports = true

# Optional I/O dependencies - installed based on user needs
[[tool.mypy.overrides]]
module = [
    "boto3",
    "boto3.*",
    "botocore",
    "botocore.*",
    "asyncssh",
    "asyncssh.*",
    "aioftp",
    "aioftp.*",
    "asyncpg",
    "asyncpg.*",
    "aiomysql",
    "aiomysql.*",
    "redis",
    "redis.*",
    "motor",
    "motor.*",
    "openpyxl",
    "openpyxl.*",
]
ignore_missing_imports = true
