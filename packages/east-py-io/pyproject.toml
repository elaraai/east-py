[project]
name = "east-py-io"
version = "0.1.0"
description = "I/O platform functions for East programming language (Python)"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "AGPL-3.0"}
authors = [
    {name = "Elara AI", email = "info@elara.ai"}
]
keywords = ["east", "platform", "io", "s3", "sqlite", "postgresql", "mysql", "redis", "mongodb", "csv", "xlsx", "xml", "ftp", "sftp", "gzip", "tar", "zip"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Interpreters",
]

dependencies = [
    "east-py",
    # Storage
    "boto3>=1.35.0",  # AWS SDK for S3 operations
    # SQL databases
    "asyncpg>=0.29.0",  # PostgreSQL async driver
    "aiomysql>=0.2.0",  # MySQL async driver
    # NoSQL
    "redis>=5.0.0",  # Redis client
    "motor>=3.3.0",  # MongoDB async driver
    # Format
    "openpyxl>=3.1.0",  # Excel XLSX support
    "defusedxml>=0.7.0",  # Safe XML parsing
    # Transfer
    "aioftp>=0.22.0",  # Async FTP client
    "asyncssh>=2.14.0",  # Async SSH/SFTP client
    # Compression (gzip, tarfile, zipfile are stdlib)
]

[tool.uv.sources]
east-py = { workspace = true }

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.0",
    "mypy>=1.11.0",
    "ruff>=0.6.0",
    "boto3-stubs[s3]>=1.35.0",  # Type stubs for boto3
    "types-redis>=4.6.0",  # Type stubs for redis
    "motor-stubs>=1.7.0",  # Type stubs for motor
    "types-openpyxl>=3.1.0",  # Type stubs for openpyxl
]

[project.urls]
Homepage = "https://github.com/elaraai/east-py"
Documentation = "https://github.com/elaraai/east-py/tree/main/packages/east-py-io"
Repository = "https://github.com/elaraai/east-py"
Issues = "https://github.com/elaraai/east-py/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["east_py_io"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
asyncio_mode = "auto"
addopts = "--verbose"

[tool.mypy]
python_version = "3.11"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["east", "east.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "boto3",
    "boto3.*",
    "botocore",
    "botocore.*",
    "aioftp",
    "aioftp.*",
    "asyncssh",
    "asyncssh.*",
    "motor",
    "motor.*",
    "defusedxml",
    "defusedxml.*",
    "asyncpg",
    "asyncpg.*",
    "aiomysql",
    "aiomysql.*",
    "redis",
    "redis.*",
    "openpyxl",
    "openpyxl.*",
]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
]
ignore = [
    "E501",   # Line too long (handled by formatter)
]
