name: Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v3

    - name: Set up Python ${{ matrix.python-version }}
      run: uv python install ${{ matrix.python-version }}

    - name: Install dependencies
      run: uv sync

    - name: Run linter
      run: uv run ruff check east tests

    - name: Type check
      run: uv run mypy east

    - name: Run tests
      run: uv run pytest

    - name: Run tests with coverage
      run: uv run pytest --cov=east --cov-report=term
