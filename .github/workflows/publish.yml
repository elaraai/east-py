name: Publish east-py-datascience to npm

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (skip actual publish)'
        required: false
        default: false
        type: boolean
      npm_tag:
        description: 'npm tag (latest for stable, beta for prerelease)'
        required: true
        default: 'beta'
        type: choice
        options:
          - latest
          - beta

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # Required for npm trusted publishing with OIDC

    defaults:
      run:
        working-directory: packages/east-py-datascience

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'
          cache-dependency-path: packages/east-py-datascience/package-lock.json
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install npm dependencies
        run: npm ci

      - name: Install Python dependencies
        working-directory: .
        run: uv sync

      - name: Build TypeScript
        run: npm run build

      - name: Run linter
        run: npm run lint

      - name: Export test IR and run TypeScript tests
        run: npm run test:export
        env:
          EXPORT_TEST_IR: /tmp/east-py-datascience

      - name: Run Python tests
        run: uv run pytest -v

      - name: Publish to npm (dry run)
        if: ${{ inputs.dry_run }}
        run: npm publish --access public --provenance --tag ${{ inputs.npm_tag }} --dry-run

      - name: Publish to npm
        if: ${{ !inputs.dry_run }}
        run: npm publish --access public --provenance --tag ${{ inputs.npm_tag }}
